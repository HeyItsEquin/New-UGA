<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>New Tab</title>
    <style>
        html { background-color: #080808; }

        #removeme {
            /* Cover entire screen */
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: none;

            margin: 0px;
            padding: 0px;
        }

        #removeme h1, h3 {
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div id="removeme">
        <h1 id="loading-text">Loading...</h1>
        <h3>You shouldn't be here long (Reload the page & check your connection if it's stuck)</h3>
    </div>

    <script>
        const GithubUrl = "HeyItsEquin/New-UGA";
        const CdnUrl = "https://cdn.jsdelivr.net/gh";

        async function getAssets() {
            let file = "index.min.html";
            let fp = `${CdnUrl}/${GithubUrl}/${file}`;

            let res = await fetch(fp);
            let text = await res.text();
            return text;
        }
        
        async function load() {
            let html = await getAssets();

            let parser = new DOMParser();
            let newDoc = parser.parseFromString(html, "text/html");

            document.documentElement.innerHTML = newDoc.documentElement.innerHTML;

            document.querySelectorAll("script").forEach(script => {
                let newScript = document.createElement("script");
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                newScript.async = script.async;
                newScript.defer = script.defer;
                document.body.appendChild(newScript);
            });
        }

        (() => {
            setInterval(() => {
                let loading = document.getElementById("loading-text");
                if (!loading) return;

                let text = loading.textContent;
                if (text === "Loading...") {
                    text = "Loading";
                } else {
                    text += ".";
                }

                loading.textContent = text;
            }, 200);
            load();
        })();
    </script>
</body>
</html>
