<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>New Tab</title>
    <style>
        html { background-color: #080808; }

        #removeme {
            /* Cover entire screen */
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: none;

            margin: 0px;
            padding: 0px;
        }

        #removeme h1, h3 {
            color: #FFFFFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>
    <div id="removeme">
        <h1 id="loading-text">Loading...</h1>
        <h3>You shouldn't be here long (Reload the page & check your connection if it's stuck)</h3>
    </div>

    <script>
        (async () => {
            // Both of these have to exclude trailing slash
            let _github_url = "HeyItsEquin/New-UGA";
            let _cdn_url = "https://cdn.jsdelivr.net/gh";

            setInterval(() => {
                let loading = document.getElementById("loading-text");
                if (!loading) return;

                let text = loading.textContent;
                if (text === "Loading...") {
                    text = "Loading";
                } else {
                    text += ".";
                }

                loading.textContent = text;
            }, 200);

            // Not necessary for now, but could be useful later
            let files = [
                "index.min.html"
            ];

            let html;

            for (let file of files) {
                let fp = `${_cdn_url}/${_github_url}@main/${file}`;

                let res = await fetch(fp);
                let text = await res.text();

                html = text;
            }

            let parser = new DOMParser();
            let doc = parser.parseFromString(html, "text/html");

            document.documentElement.innerHTML = doc.documentElement.innerHTML;

            doc.querySelectorAll("script").forEach(script => {
                let scr = document.createElement("script");
                if (script.src) {
                    scr.src = script.src;
                } else {
                    scr.textContent = script.textContent;
                }        
                document.body.appendChild(scr);
            });
        })();
    </script>
</body>
</html>
